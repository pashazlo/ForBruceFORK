name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build Firmware
        run: pio run

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-flipper-firmware
          path: .pio/build/esp32-s3-devkitc-1/firmware.bin
